<!DOCTYPE html>
<html>
<head>
    <title>Experiment 14 - Full Stack App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 60px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
        }

        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Full Stack Application</h1>

        <p>Experiment 14: Cloud Deployment</p>

        <button onclick="checkStatus()">
            Check Application Status
        </button>

        <div id="result"></div>
    </div>

    <script>
        async function checkStatus() {
            const response = await fetch("/api/status");
            const data = await response.json();

            document.getElementById("result").innerHTML =
                `<p>${data.message}</p>
                 <p>Database: ${data.database}</p>
                 <p>JWT Configured: ${data.jwtConfigured}</p>`;
        }
    </script>

</body>
</html>
